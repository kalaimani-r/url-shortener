spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: url-shortener
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  deduplicate-long-urls: true
  default-ttl-days: 0
  cache:
    redirect-ttl-seconds: 300
    maximum-size: 10000
  rate-limit:
    enabled: true
    requests-per-minute: 120

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./.data/urlshortener;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DATABASE_USERNAME:urlshortener}
    password: ${DATABASE_PASSWORD:urlshortener}
    driver-class-name: org.postgresql.Driver
